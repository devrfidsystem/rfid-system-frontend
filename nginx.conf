server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Behind Cloudflare/Traefik: log the real client IP, not the proxy's.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml;

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html must never be cached, or clients pin to a stale bundle
    # and keep requesting asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires    0;
    }

    # SPA history fallback — Vue Router owns client-side routes, so any
    # unmatched path returns index.html instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide nginx version in error pages and the Server header.
    server_tokens off;
}
